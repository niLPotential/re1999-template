<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>re1999 template</title>
    <script type="module" src="./index.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>

<body x-data="{data: ''}">
    <textarea x-model="data" name="data"></textarea>
    <textarea x-text="$template(data)"></textarea>
    <button type="button" @click="$clipboard($template(data))">Copy</button>
</body>

</html>
